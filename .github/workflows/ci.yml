name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources (syntax check)
        run: python -m compileall app

      # The image label must name the licenses of the bundled code, not only
      # this repository's MIT license, and the README must say where the
      # image's notices ship.
      - name: Check license statements
        run: |
          grep -q '^LABEL org.opencontainers.image.licenses="MIT AND ' Dockerfile
          grep -q 'Third-Party-Notices.txt' README.md
          grep -q 'Rust-Licenses.html' README.md

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
